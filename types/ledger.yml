# Graph shape for an imported general ledger.
#
# Persisted entities, not virtual joins. Virtual cypher earns its keep over large, volatile,
# externally-owned collections; a ledger export is the opposite — bounded (a few thousand rows a
# year), immutable once the period closes, and already on disk. It also runs into the anchoring
# rule: "what did I spend across every category" has no bound anchor to traverse from, so the
# most useful questions would be rejected at plan time.
#
# Three nodes, because a journal line alone cannot answer the interesting questions. A sale's
# customer is named on the receivable line while its revenue sits on the income line, so something
# has to hold them together — that is LedgerTransaction.
#
# They are joined BY PROPERTY, not by edge: a bulk create cannot carry relations, so a posting
# records accountCode and transactionRef and the views match on them (always with entity and
# source, or two companies' books would join into each other). Edges can be added later without
# changing what a row means.

- name: LedgerAccount
  description: >-
    An account in the chart of accounts, as the source classifies it. The spine of every spend
    and revenue question: an account is what turns a payment into a category. A user's words are
    RESOLVED against these names, never assumed to match one — and when nothing matches, return
    these names rather than a total of zero, which reads as "you spent nothing" instead of "no
    such category".
  properties:
    key:
      description: >-
        Identity. Composite of source, entity and code, because an account code is only unique
        within one company's books and a user may keep more than one set.
      metadata:
        identity: "true"
    title:
      description: >-
        Display name — the account name as the bookkeeper wrote it, e.g. 'Staff Amenities'. Named
        `title` because the host picks title/name/summary as a node's headline, and a type with
        none of them renders as its id in every list and query result.
    code:
      description: "The source's account code, e.g. 6-4390. How postings reference it."
    accountType:
      description: >-
        asset, liability, equity, income, expense, cost-of-sales, other-income, other-expense,
        or unknown. Taken from the source where it states one; never inferred from the name.
    parentCode:
      description: "Parent account code where the source models a hierarchy. Absent when flat."
    taxCode:
      description: "Tax treatment as the source records it, e.g. GST, FRE, N-T. Not interpreted."
    header:
      description: "True/false. A rollup account that cannot be posted to."
    active:
      description: "True/false. False for an account the bookkeeper has retired."
    entity:
      description: "The company whose books this belongs to, as named by the source."
    source:
      description: "Adapter that produced it, e.g. myob-ceedata."

- name: LedgerTransaction
  description: >-
    One accounting event, holding the postings that balance against each other. Exists because
    the parts of a transaction carry different facts: the counterparty is named on one line and
    the amount that matters is on another.
  properties:
    key:
      description: "Identity. Composite of source, entity and the source's transaction reference."
      metadata:
        identity: "true"
    title:
      description: "Display name — the transaction's narration. See LedgerAccount.title."
    reference:
      description: "The source's own grouping reference for the postings."
    date:
      description: "Transaction date, ISO yyyy-mm-dd."
    narration:
      description: >-
        The source's description, verbatim — usually naming a counterparty, sometimes a bank
        feed's raw merchant string. Kept unparsed because it is evidence: interpreting it is a
        separate, fallible step that must never overwrite what the books say.
    counterparty:
      description: >-
        The canonicalised counterparty for the whole transaction, resolved from its asset leg.
        Identical to the `counterparty` on its postings.
    counterpartyName:
      description: >-
        Counterparty as read from the narration, when one could be read confidently. A
        best-effort reading of free text, so it is recorded alongside the narration rather than
        instead of it, and is absent rather than guessed.
      metadata:
        relationship: TRANSACTED_WITH
        target: Organization
        matchBy: name
    entity:
      description: "The company whose books this belongs to."
    source:
      description: "Adapter that produced it."

- name: LedgerEntry
  description: >-
    A single posting: an amount against one account, within one transaction. The grain every
    total is computed from.
  properties:
    key:
      description: "Identity. Composite of source, entity, transaction reference and line id."
      metadata:
        identity: "true"
    title:
      description: "Display name — the posting's narration. See LedgerAccount.title."
    amount:
      description: >-
        Signed, in the books' own currency and the source's own convention: positive debit,
        negative credit. Never rounded or absolute-valued on import — the sign is what makes
        income and expenditure distinguishable. So an EXPENSE total is `sum(e.amount)` and already
        reads positive, while an INCOME total is `-sum(e.amount)`. Negating an expense reports every
        spend as a negative number.
    date:
      description: >-
        Posting date, ISO yyyy-mm-dd, stored as a STRING. Denormalised from the transaction so a
        period filter needs no join, and being ISO it compares LEXICALLY:
        `e.date >= '2025-07-01' AND e.date <= '2026-06-30'`.
        BOTH SIDES STAY STRINGS. Never wrap the property in date()/datetime(), and never wrap the
        literal either — `e.date >= date('2025-09-01')` compares a string to a Date and matches
        NOTHING, exactly like `date(datetime()).year - 1 + '-01-01'`, which is integer arithmetic
        concatenated to a string. Neither errors; both silently return zero rows for a category that
        has postings.
    accountCode:
      description: >-
        The account posted to. Joined to LedgerAccount by code, together with entity and source —
        a bulk create cannot carry edges, so the join is by property.
    transactionRef:
      description: >-
        The transaction this posting belongs to. Joined to LedgerTransaction by reference, together
        with entity and source. This is what ties a sale's customer to its revenue.
    description:
      description: "The posting's own narration, verbatim."
    accountName:
      description: >-
        The account's name, copied onto the posting, e.g. 'Staff Amenities'. Denormalised on
        purpose: "what did I spend on X, by supplier" is then one GROUP BY over postings. Without
        it the only route is a join this graph has no edges for, and an aggregate that cannot be
        expressed comes back empty — which reads as "no such spending" rather than "wrong query".
    accountType:
      description: >-
        The account's type, copied onto the posting: income, expense, asset, liability, equity,
        cost-of-sales, other-income, other-expense. Lets a total be scoped without a join.
    counterparty:
      description: >-
        Who the other side was, canonicalised so every spelling of one party shares a name. Read
        from the transaction's asset leg, never from this posting's own text: on a sale the income
        line describes the WORK and the receivable line names the CLIENT. Absent when the
        transaction has no readable other side — absent means unknown, never "none".
    counterpartyKey:
      description: >-
        Match key for the counterparty: case- and punctuation-free, company suffixes removed.
        Group by this when a total must not be split by spelling; display `counterparty`.
    counterpartyNarration:
      description: >-
        The raw text the counterparty was read from, kept verbatim. A merge of several spellings
        must be auditable — this is what lets a report show which variants it combined instead of
        asking anyone to trust it.
    counterpartySource:
      description: >-
        Where the name came from: `invoice` (a human-entered document line), `bank` (a feed's own
        text), or `same-leg` (both legs carried the same text). An invoice name is stronger
        evidence than a feed string.
    entity:
      description: "The company whose books this belongs to."
    source:
      description: "Adapter that produced it."
  # FEW-SHOT for the text-to-cypher generator. Present because the label being VISIBLE in the schema
  # turned out not to be enough: shown a ledger alongside the core billing shapes, the generator
  # answered "what did I spend on travel" by filtering a Bill's title/currency/description for the
  # word, and answered "list my travel items" by grepping FILENAMES. Both returned nothing and were
  # reported as a spend of zero. These teach the PATTERN — the account is RESOLVED not matched, the
  # credit convention is negated, the grain is the posting — with placeholder categories only.
  examples:
    - q: "what did I spend on <category>"
      cypher: |
        MATCH (e:LedgerEntry)
        WHERE toLower(e.accountName) CONTAINS toLower('<category>') AND e.accountType = 'expense'
        RETURN round(sum(e.amount), 2) AS total, count(*) AS postings
    - q: "what did I spend in total"
      cypher: |
        MATCH (e:LedgerEntry) WHERE e.accountType = 'expense'
        RETURN round(sum(e.amount), 2) AS total, count(*) AS postings
    - q: "what was my total income"
      cypher: |
        MATCH (e:LedgerEntry) WHERE e.accountType IN ['income', 'other-income']
        RETURN round(sum(-e.amount), 2) AS total, count(*) AS postings
    - q: "list my <category> items, largest first"
      cypher: |
        MATCH (e:LedgerEntry)
        WHERE toLower(e.accountName) CONTAINS toLower('<category>') AND e.accountType = 'expense'
        RETURN e.date AS date, e.counterparty AS supplier, e.amount AS amount
        ORDER BY amount DESC LIMIT 200
    - q: "break my <category> spend down by supplier"
      cypher: |
        MATCH (e:LedgerEntry)
        WHERE toLower(e.accountName) CONTAINS toLower('<category>') AND e.accountType = 'expense'
        RETURN coalesce(e.counterpartyKey, e.counterparty) AS supplier,
               round(sum(e.amount), 2) AS total, count(*) AS postings
        ORDER BY total DESC LIMIT 200
    - q: "who is my biggest client"
      cypher: |
        MATCH (e:LedgerEntry) WHERE e.accountType IN ['income', 'other-income']
        RETURN coalesce(e.counterpartyKey, e.counterparty) AS client,
               round(sum(-e.amount), 2) AS income
        ORDER BY income DESC LIMIT 1
    - q: "which supplier did I spend the most with"
      cypher: |
        MATCH (e:LedgerEntry) WHERE e.accountType = 'expense'
        RETURN coalesce(e.counterpartyKey, e.counterparty) AS supplier,
               round(sum(e.amount), 2) AS total
        ORDER BY total DESC LIMIT 1
    - q: "what did I spend on <category> between <from> and <to>"
      cypher: |
        MATCH (e:LedgerEntry)
        WHERE e.accountType = 'expense'
          AND toLower(e.accountName) CONTAINS toLower('<category>')
          AND e.date >= '<from>' AND e.date <= '<to>'
        RETURN round(sum(e.amount), 2) AS total, count(*) AS postings
    - q: "which spend categories do I have"
      cypher: |
        MATCH (a:LedgerAccount) WHERE a.accountType = 'expense'
        RETURN a.title AS category ORDER BY category LIMIT 200
    - q: "who pays me, and how concentrated is it"
      cypher: |
        MATCH (e:LedgerEntry) WHERE e.accountType IN ['income', 'other-income']
        RETURN coalesce(e.counterpartyKey, e.counterparty) AS client,
               round(sum(-e.amount), 2) AS income, count(*) AS postings
        ORDER BY income DESC LIMIT 200

- name: LedgerCoverage
  description: >-
    Which periods have actually been imported, per company and source. Consulted before any
    total is reported: a question about a period outside it must be answered "no data for that
    period", never zero. A zero looks like a fact, and a wrong fact about money is worse than an
    admitted gap.
  properties:
    key:
      description: "Identity. Composite of source, entity and the covered window."
      metadata:
        identity: "true"
    title:
      description: "Display name — entity and covered period. See LedgerAccount.title."
    entity:
      description: "The company whose books these are."
    fromDate:
      description: "First date covered, ISO yyyy-mm-dd, inclusive."
    toDate:
      description: "Last date covered, ISO yyyy-mm-dd, inclusive."
    source:
      description: "Adapter that produced it."
    importedAt:
      description: "When this window was last imported, ISO instant."
    lineCount:
      description: "Whole number of postings imported for this window."
    rejectedCount:
      description: >-
        Postings the import could not read. Recorded so a total can be qualified honestly —
        "2,338 of 2,340 lines" is a different claim from "2,340 lines".
